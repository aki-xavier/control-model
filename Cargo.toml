[package]
name = "control-model"
description = "The model basis of the control stack: the XML/URDF/MJCF readers, the fixed chain and the floating-base tree, and their PGA kinematics and dynamics. Pure model, no plant, no engine."
version = "0.1.0"
edition = "2021"
# 1.87 is `is_multiple_of`, which the pga crate's parity checks call and this crate's own numeric
# kernels are free to; the sibling crates state the same floor.
rust-version = "1.87"
license = "MIT"

[dependencies]
pga = { path = "../pga" }
control-math = { path = "../control-math" }
roxmltree = "0.21.1"

[dev-dependencies]
# The sidecar gate (tests/mjcf.rs) decodes the emitted JSON and compares VALUES rather than pinned
# text, so the crate needs a reader — in its tests, and only there. `float_roundtrip` is REQUIRED:
# serde_json's default f64 parsing is not correctly rounded, so a value one ULP off parses equal
# (measured here: `120.00000000000001` read back as `120.0`) and the gate would be blind to it.
serde_json = { version = "1", features = ["float_roundtrip"] }

[lints.clippy]
# The one default lint this crate does not follow, and the allowance it had as part of `simu` (whose
# Cargo.toml carries the full rationale): the numeric kernels index parallel arrays by a MODEL count
# — `n`, `nq`, `nv`, `nbody` — not by a slice's length, so the index is the maths the loop is
# written in and an iterator would take the bound from the slice instead.
needless_range_loop = "allow"
